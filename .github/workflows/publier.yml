# Vérifie les liens, construit le site et le publie sur GitHub Pages (branche « gh-pages »).
# Se lance à chaque envoi sur « main », et chaque nuit pour faire apparaître l'œuvre du jour.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 23 * * *' # 0 h 07 à Paris en hiver, 1 h 07 en été
  workflow_dispatch:

permissions:
  contents: write # pour écrire le site construit dans la branche gh-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Un lien qui ne répond pas 200 est masqué sur le site ; une fiche dont la ressource
      # ne répond pas n'est pas publiée. Le travail est signalé en échec à la fin (e-mail de GitHub).
      - name: Vérifier les liens
        id: verification
        continue-on-error: true
        run: npm run verify -- --ecrire

      - name: Garder les images déjà téléchargées
        uses: actions/cache@v4
        with:
          path: src/assets/oeuvres
          key: images-${{ hashFiles('src/content/oeuvres/*.md') }}
          restore-keys: images-

      - name: Construire
        run: npm run build
        env:
          CURIOSA_EXIGER_VERIFICATION: '1'

      # Le site construit (dossier dist) remplace entièrement le contenu de la branche gh-pages,
      # que GitHub Pages sert à l'adresse https://m4t-1a5.github.io/Curiosa/
      - name: Mettre en ligne
        working-directory: dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit à partir de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Signaler les liens à corriger
        if: steps.verification.outcome == 'failure'
        run: |
          echo "::error::Des liens ou des fiches sont à corriger : voir l'étape « Vérifier les liens » et le résumé du travail. Ils restent masqués sur le site jusqu'à leur correction."
          exit 1
